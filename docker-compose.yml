# Хранилища для проекта historical-budget-backend.
# Для лабораторной 1 нужен только minio: в нём лежат изображения
# и видео ресурсов (craft_resource). Остальное понадобится с лабораторной 2.

services:

  # Объектное хранилище: изображения и видео ресурсов справочника
  minio:
    image: minio/minio:latest
    container_name: historical-budget-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API, отсюда страницы берут файлы
      - "9001:9001"   # веб-консоль управления
    volumes:
      - minio-data:/data

  # База данных, подключается в лабораторной 2
  postgres:
    image: postgres:16
    container_name: historical-budget-postgres
    environment:
      POSTGRES_USER: budget_user
      POSTGRES_PASSWORD: budget_pass
      POSTGRES_DB: historical_budget
    ports:
      - "5433:5432"   # 5433, потому что 5432 занят локальным postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # Кеш и хранилище сессий, подключается в лабораторной 2
  redis:
    image: redis:7
    container_name: historical-budget-redis
    ports:
      - "6379:6379"

  # Веб-интерфейс к базе данных
  adminer:
    image: adminer:latest
    container_name: historical-budget-adminer
    ports:
      - "8081:8080"   # 8081, потому что 8080 занят другим контейнером

volumes:
  minio-data:
  postgres-data:
